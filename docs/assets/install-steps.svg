<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="414" viewBox="0 0 1280 414" role="img" aria-labelledby="install-title install-desc">
  <title id="install-title">标签轮盘：Chrome 本地安装流程示意</title>
  <desc id="install-desc">四步安装：进入 chrome://extensions 打开开发者模式，点击加载已解压的扩展程序，选择包含 manifest.json 的插件文件夹，最后刷新已打开的网页。此图是安装流程示意，不是 Chrome 原生界面截图。</desc>
  <defs>
    <linearGradient id="install-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11131f"/><stop offset="1" stop-color="#0c111b"/></linearGradient>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191b2b"/><stop offset="1" stop-color="#141a26"/></linearGradient>
  </defs>
  <rect width="1280" height="414" rx="20" fill="url(#install-bg)"/>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="64" y="49" fill="#9484b5" font-size="10" font-weight="600" letter-spacing="2.7">SETUP GUIDE / CHROME</text>
    <text x="64" y="96" fill="#eeeaf5" font-size="29" font-weight="600" letter-spacing="1.3">四步，让切换更顺手。</text>
    <rect x="1060" y="58" width="156" height="30" rx="15" fill="#ffffff04" stroke="#37364a"/>
    <circle cx="1080" cy="73" r="3" fill="#8b7aaa"/>
    <text x="1093" y="78" fill="#a49bb8" font-size="12">安装流程示意</text>

    <g transform="translate(64 132)">
      <rect width="270" height="222" rx="12" fill="url(#card-bg)" stroke="#363149"/>
      <text x="20" y="31" fill="#b29ad7" font-size="12" font-weight="600" letter-spacing="2">01</text>
      <path d="M232 24h16m-5-5 5 5-5 5" fill="none" stroke="#5e5574" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="56" width="230" height="30" rx="6" fill="#10141f" stroke="#32364a"/>
      <circle cx="36" cy="71" r="3" fill="#8d7ba8"/>
      <text x="49" y="76" fill="#b6aec9" font-size="13" font-family="Consolas,'Courier New',monospace">chrome://extensions</text>
      <text x="20" y="119" fill="#a3aac0" font-size="13">开发者模式</text>
      <rect x="207" y="101" width="43" height="23" rx="11.5" fill="#7f69a5"/>
      <circle cx="238" cy="112.5" r="8.5" fill="#e8ddfa"/>
      <path d="M20 145H250" stroke="#2a2c3e"/>
      <text x="20" y="176" fill="#e3deee" font-size="18" font-weight="600">打开开发者模式</text>
      <text x="20" y="201" fill="#7f899f" font-size="12">进入 Chrome 扩展管理页</text>
    </g>

    <g transform="translate(358 132)">
      <rect width="270" height="222" rx="12" fill="url(#card-bg)" stroke="#363149"/>
      <text x="20" y="31" fill="#b29ad7" font-size="12" font-weight="600" letter-spacing="2">02</text>
      <path d="M232 24h16m-5-5 5 5-5 5" fill="none" stroke="#5e5574" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="69" width="230" height="43" rx="7" fill="#29213e" stroke="#76618f"/>
      <path d="M41 83v15m-7-7.5h14" fill="none" stroke="#c4a9ed" stroke-width="1.6" stroke-linecap="round"/>
      <text x="61" y="95" fill="#d4c5ea" font-size="12">加载已解压的扩展程序</text>
      <path d="m230 102 1 24 6-6 5 10 5-3-6-9 9-1Z" fill="#dfd5ed" stroke="#161522" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M20 145H250" stroke="#2a2c3e"/>
      <text x="20" y="176" fill="#e3deee" font-size="18" font-weight="600">加载已解压的扩展</text>
      <text x="20" y="201" fill="#7f899f" font-size="12">点击扩展页左上方的加载按钮</text>
    </g>

    <g transform="translate(652 132)">
      <rect width="270" height="222" rx="12" fill="url(#card-bg)" stroke="#34404d"/>
      <text x="20" y="31" fill="#84b7c4" font-size="12" font-weight="600" letter-spacing="2">03</text>
      <path d="M232 24h16m-5-5 5 5-5 5" fill="none" stroke="#4f6576" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 68h38l12 12h150v44H28Z" fill="#1d2c3a" stroke="#5d8196" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M28 80H228" stroke="#5d8196" stroke-width="1.3"/>
      <rect x="67" y="91" width="146" height="25" rx="4" fill="#101a26" stroke="#3d586e"/>
      <path d="M81 97h7v12h-7Z" fill="none" stroke="#91b7c9" stroke-linejoin="round"/>
      <text x="96" y="108" fill="#b8d0dc" font-size="12" font-family="Consolas,'Courier New',monospace">manifest.json</text>
      <path d="M20 145H250" stroke="#2a303e"/>
      <text x="20" y="176" fill="#e3deee" font-size="18" font-weight="600">选择插件文件夹</text>
      <text x="20" y="201" fill="#7f899f" font-size="12">选择含 manifest.json 的那一层</text>
    </g>

    <g transform="translate(946 132)">
      <rect width="270" height="222" rx="12" fill="url(#card-bg)" stroke="#34404d"/>
      <text x="20" y="31" fill="#84b7c4" font-size="12" font-weight="600" letter-spacing="2">04</text>
      <circle cx="241" cy="24" r="8" fill="#233641"/>
      <path d="m237 24 3 3 5-6" fill="none" stroke="#8ec7ce" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="54" width="214" height="74" rx="7" fill="#121925" stroke="#405464"/>
      <path d="M28 76H242" stroke="#344454"/>
      <circle cx="42" cy="65" r="2" fill="#66788d"/><path d="M51 65H122" stroke="#354758" stroke-width="3" stroke-linecap="round"/>
      <path d="M222 59a6 6 0 1 0 1 8m-1-8v5h-5" fill="none" stroke="#96c1cc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 94H111M44 107H154" stroke="#374858" stroke-width="4" stroke-linecap="round"/>
      <rect x="184" y="88" width="38" height="24" rx="5" fill="#243641"/>
      <path d="m197 100 4 4 8-9" fill="none" stroke="#86b7c3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 145H250" stroke="#2a303e"/>
      <text x="20" y="176" fill="#e3deee" font-size="18" font-weight="600">刷新已打开的网页</text>
      <text x="20" y="201" fill="#7f899f" font-size="12">让新版本在当前网页生效</text>
    </g>
    <circle cx="68" cy="387" r="3" fill="#7fa5ad"/>
    <text x="81" y="391" fill="#7f899f" font-size="12">首次安装请先解压 ZIP；选择文件夹，而不是压缩包。</text>
    <text x="1216" y="391" fill="#5d6880" font-size="10" letter-spacing="1.7" text-anchor="end">TAB ORBIT</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="413" rx="19.5" fill="none" stroke="#333044"/>
</svg>
