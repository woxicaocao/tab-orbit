<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">标签轮盘 Tab Orbit — 下一站，就在鼠标旁。</title>
  <desc id="hero-desc">深色紫青配色的标签轮盘品牌横幅。按住 Ctrl 和鼠标右键呼出，悬停选择，松开切换。右侧为五节点轨道与鼠标指针的抽象示意。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11131f"/><stop offset="1" stop-color="#0b1019"/>
    </linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d3c0ff"/><stop offset="1" stop-color="#b69bed"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8c78bb" stop-opacity="0"/><stop offset=".5" stop-color="#8c78bb" stop-opacity=".7"/><stop offset="1" stop-color="#8c78bb" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8f91b2" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <rect x="656" width="624" height="440" fill="url(#grid)"/>
    <path d="M666 64V376" stroke="#27293a" stroke-opacity=".65"/>
    <path d="M74 384H1206" stroke="url(#rail)" stroke-opacity=".45"/>

    <g transform="translate(91 58)" stroke="#af92f4" stroke-width="1.4">
      <circle r="14" fill="none"/>
      <circle r="3.4" fill="#e5d7ff" stroke="none"/>
      <g fill="#af92f4" stroke="none">
        <circle cy="-14" r="3.4"/><circle cx="13.3" cy="-4.3" r="4.5" fill="#ddc8ff"/>
        <circle cx="8.2" cy="11.3" r="3.4"/><circle cx="-8.2" cy="11.3" r="3.4"/><circle cx="-13.3" cy="-4.3" r="3.4"/>
      </g>
    </g>
    <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
      <text x="121" y="63" fill="#a49cb8" font-size="12" font-weight="600" letter-spacing="3.1">TAB ORBIT</text>
      <text x="74" y="165" fill="#f0edf7" font-size="60" font-weight="600" letter-spacing="4">标签轮盘</text>
      <text x="78" y="202" fill="#9c8dbb" font-size="14" letter-spacing="7.6">A SHORTCUT TO YOUR NEXT TAB</text>
      <text x="77" y="259" fill="#c0b8cf" font-size="25" font-weight="400" letter-spacing="1">下一站，就在鼠标旁。</text>

      <g transform="translate(77 310)">
        <rect width="146" height="35" rx="7" fill="#201c30" stroke="#4a3c67"/>
        <text x="13" y="23" fill="#a58cce" font-size="10" letter-spacing=".8">01</text>
        <text x="39" y="23" fill="#d8c9ef" font-size="12">Ctrl + 右键</text>
        <path d="M159 17.5H174m-4-4 4 4-4 4" fill="none" stroke="#61566f" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="187" width="123" height="35" rx="7" fill="#171c28" stroke="#30374a"/>
        <text x="200" y="23" fill="#789baa" font-size="10" letter-spacing=".8">02</text>
        <text x="227" y="23" fill="#bcc8d6" font-size="12">悬停选择</text>
        <path d="M323 17.5H338m-4-4 4 4-4 4" fill="none" stroke="#61566f" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="351" width="123" height="35" rx="7" fill="#171c28" stroke="#30374a"/>
        <text x="364" y="23" fill="#789baa" font-size="10" letter-spacing=".8">03</text>
        <text x="391" y="23" fill="#bcc8d6" font-size="12">松开切换</text>
      </g>
      <text x="77" y="412" fill="#626b82" font-size="10" letter-spacing="1.6">CHROME EXTENSION</text>
      <text x="1206" y="412" fill="#626b82" font-size="10" letter-spacing="1.4" text-anchor="end">LESS SEARCHING. MORE FLOW.</text>
    </g>

    <g transform="translate(963 220)">
      <circle r="187" fill="none" stroke="#252837" stroke-width="1"/>
      <circle r="143" fill="none" stroke="#5b4b79" stroke-width="1.2"/>
      <circle r="106" fill="none" stroke="#363147" stroke-dasharray="2 8"/>
      <path d="M-204 0h14m380 0h14M0-204v14M0 190v14" stroke="#454153" stroke-width="1"/>
      <path d="M-4 0H4M0-4V4" stroke="#676078"/>
      <circle r="22" fill="#161727" stroke="#3c334d"/>
      <circle r="6" fill="#e5d7ff"/>
      <path d="M24-8 102-34" stroke="#9b85bb" stroke-dasharray="3 5" stroke-opacity=".65"/>
      <path d="M-98-104a143 143 0 0 1 228 44" fill="none" stroke="#a28ac7" stroke-width="2" stroke-linecap="round"/>
      <circle cy="-187" r="2.5" fill="#8b76ad"/>
      <circle cx="-187" r="2.5" fill="#4f6576"/>
      <circle cy="187" r="2.5" fill="#4f6576"/>

      <g transform="translate(0 -143)">
        <rect x="-23" y="-23" width="46" height="46" rx="13" fill="#1d1d2e" stroke="#4c405f"/>
        <g fill="none" stroke="#b5a0d4" stroke-width="1.4">
          <circle r="9"/><ellipse rx="4" ry="9"/><path d="M-8-3H8M-8 3H8"/>
        </g>
      </g>
      <g transform="translate(136 -44)">
        <circle r="44" fill="#141524" stroke="#6b548c" stroke-opacity=".7"/>
        <rect x="-32" y="-32" width="64" height="64" rx="18" fill="url(#selected)" stroke="#e1d0ff"/>
        <g fill="none" stroke="#4c3b69" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m-9-8-9 8 9 8m18-16 9 8-9 8M4-11l-8 22"/>
        </g>
        <path d="m25 19 1 38 9-10 9 17 7-4-10-16 14-1Z" fill="#f4f0fc" stroke="#11131e" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <g transform="translate(84 116)">
        <rect x="-23" y="-23" width="46" height="46" rx="13" fill="#19212e" stroke="#3e5265"/>
        <g fill="none" stroke="#87bac9" stroke-width="1.5" stroke-linejoin="round">
          <rect x="-9" y="-10" width="18" height="20" rx="3"/><path d="M-5-4H5M-5 1H5M-5 6H1"/>
        </g>
      </g>
      <g transform="translate(-84 116)">
        <rect x="-23" y="-23" width="46" height="46" rx="13" fill="#1c1d2d" stroke="#49405e"/>
        <g fill="none" stroke="#a896c2" stroke-width="1.5" stroke-linejoin="round">
          <path d="M-11-7h9l3 3h10V9h-22Z"/><path d="M-11-2H11"/>
        </g>
      </g>
      <g transform="translate(-136 -44)">
        <rect x="-23" y="-23" width="46" height="46" rx="13" fill="#19212e" stroke="#3e5265"/>
        <g fill="none" stroke="#87bac9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="-10" y="-8" width="20" height="16" rx="3"/><path d="m-3-4 7 4-7 4Z"/>
        </g>
      </g>
    </g>
    <rect x=".5" y=".5" width="1279" height="439" rx="21.5" fill="none" stroke="#333044"/>
  </g>
</svg>
